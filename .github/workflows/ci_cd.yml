name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint_and_test:
    name: Lint, Test & E2E
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit

    - name: Static Analysis & Linting (Flake8 & MyPy)
      run: |
        flake8 shopsage/
        mypy shopsage/

    - name: Security Scanning (Bandit)
      run: |
        bandit -r shopsage/ -c bandit.yaml || true

    - name: Run Backend Unit Tests
      env:
        GOOGLE_API_KEY: "dummy_key_for_tests"
      run: |
        pytest tests/ --ignore=tests/e2e --cov=shopsage --cov-report=xml

    - name: Install Playwright Browsers
      run: playwright install --with-deps chromium

    - name: Run E2E Tests
      env:
        GOOGLE_API_KEY: "dummy_key_for_tests"
      run: |
        # Start server in background
        uvicorn app:app --host 127.0.0.1 --port 8000 &
        SERVER_PID=$!
        
        # Wait for server to start
        sleep 5
        
        # Run playwright tests
        pytest tests/e2e -v
        
        # Cleanup
        kill $SERVER_PID

  deploy_dry_run:
    name: Deploy (Dry Run)
    needs: lint_and_test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Mock Terraform Init & Plan
      run: |
        echo "Initializing Terraform..."
        echo "Running Terraform Plan..."
        echo "Plan: 0 to add, 0 to change, 0 to destroy."
        echo "Dry run successful. Infrastructure configuration is valid."

    - name: Mock Docker Push & ECS Update
      run: |
        echo "Building shopsage-ai:latest..."
        echo "Pushing to ECR (skipped in dry run)..."
        echo "Updating ECS Service (skipped in dry run)..."
        echo "Deployment simulated successfully."
