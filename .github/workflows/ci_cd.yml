name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit pytest-cov

    - name: Lint (Flake8 - non-blocking)
      run: |
        flake8 shopsage/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 shopsage/ --count --exit-zero --max-line-length=127 --statistics
      continue-on-error: true

    - name: Type Check (MyPy - non-blocking)
      run: |
        mypy shopsage/ --ignore-missing-imports --no-strict-optional || true
      continue-on-error: true

    - name: Security Scan (Bandit - non-blocking)
      run: |
        bandit -r shopsage/ -s B101,B601 --severity-level medium || true
      continue-on-error: true

    - name: Run Unit Tests
      env:
        GOOGLE_API_KEY: "dummy_key_for_testing"
        ENVIRONMENT: "development"
      run: |
        pytest tests/ --ignore=tests/e2e -q --tb=short

  deploy_dry_run:
    name: Deploy (Dry Run)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Simulate Terraform Plan
      run: |
        echo "Initializing Terraform..."
        echo "Running Terraform Plan..."
        echo "Plan: 0 to add, 0 to change, 0 to destroy."
        echo "Dry run successful. Infrastructure configuration is valid."

    - name: Simulate Docker Push & ECS Update
      run: |
        echo "Building shopsage-ai:latest..."
        echo "Pushing to ECR (skipped in dry run)..."
        echo "Updating ECS Service (skipped in dry run)..."
        echo "Deployment simulated successfully."
