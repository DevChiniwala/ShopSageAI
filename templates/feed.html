<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="ShopSage AI — Discover your perfect style with AI-powered product discovery">
    <title>For You — ShopSage AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/feed.css">
</head>
<body>
    <!-- ═══ Ambient Background ═══ -->
    <div class="ambient-bg" aria-hidden="true">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
    </div>

    <!-- ═══ Feed Header ═══ -->
    <header class="feed-header">
        <div class="feed-header-title">
            ShopSage <span class="ai-badge">AI</span>
        </div>
        <div class="feed-tabs">
            <button class="feed-tab active" data-filter="foryou">For You</button>
            <button class="feed-tab" data-filter="trending">Trending</button>
            <button class="feed-tab" data-filter="deals">Deals</button>
        </div>
    </header>

    <!-- ═══ Feed Container ═══ -->
    <div id="feed-container" class="feed-container" role="feed" aria-label="Product discovery feed">
        <!-- Cards injected by feed.js -->
    </div>

    <!-- ═══ Bottom Navigation ═══ -->
    <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-item active" data-nav="feed" aria-label="For You feed">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="currentColor" fill-opacity="0.15"/>
            </svg>
            <span class="nav-label">For You</span>
        </button>
        <button class="nav-item" data-nav="search" aria-label="Search products">
            <svg viewBox="0 0 24 24" fill="none">
                <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
                <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="nav-label">Search</span>
        </button>
        <button class="nav-item" data-nav="style" aria-label="AI Style advisor">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="nav-label">Style AI</span>
        </button>
        <button class="nav-item" data-nav="collections" aria-label="Your collections">
            <svg viewBox="0 0 24 24" fill="none">
                <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
                <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
                <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
                <rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span class="nav-label">Collections</span>
        </button>
        <button class="nav-item" data-nav="profile" aria-label="Your profile">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span class="nav-label">Profile</span>
        </button>
    </nav>

    <script src="/static/js/feed.js"></script>
</body>
</html>
